<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="#f3f5f7" name="theme-color"/>
<title>GA Services Portal</title>
<script src="tema.js?v=15"></script>
<style>
    :root {
      --bg: #f3f5f7;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #1d2939;
      --muted: #667085;
      --line: #e4e7ec;
      --line-strong: #d0d5dd;
      --accent: #234b78;
      --accent-soft: #edf4fb;
      --accent-2: #b54a16;
      --shadow: 0 8px 24px rgba(16,24,40,.05);
      --radius: 14px;
      --ease: cubic-bezier(.2,.75,.25,1);
    }

    * { box-sizing: border-box; }

    html {
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
      letter-spacing: -.01em;
    }

    a { color: inherit; }
    button { font: inherit; }

    .shell {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
      padding: 18px 0 42px;
    }

    .appbar {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 10px 12px 10px 16px;
      position: sticky;
      top: 10px;
      z-index: 20;
      background: rgba(255,255,255,.96);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(16,24,40,.055);
      backdrop-filter: blur(10px);
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 205px;
      height: 58px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      overflow: hidden;
      border-radius: 10px;
      background: #fff;
    }

    .brand-logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: left center;
    }

    .brand-divider {
      width: 1px;
      height: 42px;
      background: var(--line);
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-copy strong {
      display: block;
      color: #24364b;
      font-size: 14px;
      font-weight: 750;
      letter-spacing: -.01em;
    }

    .brand-copy span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11.5px;
      letter-spacing: 0;
    }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      flex: 0 0 auto;
      background: #f2f4f7;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .tab {
      padding: 8px 14px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #667085;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 680;
      transition: background .16s var(--ease), color .16s var(--ease), box-shadow .16s var(--ease);
    }

    .tab:hover { color: var(--text); }

    .tab.active {
      background: #fff;
      color: #24364b;
      box-shadow: 0 1px 4px rgba(16,24,40,.08);
    }

    .view {
      display: none;
      padding-top: 26px;
    }

    .view.active {
      display: block;
      animation: fadeIn .18s var(--ease);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: none; }
    }

    .section + .section {
      margin-top: 26px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 12px;
      padding: 0 2px;
    }

    .section-title h2 {
      margin: 0;
      color: #25364a;
      font-size: 15px;
      font-weight: 760;
      letter-spacing: -.015em;
    }

    .section-title p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 11.5px;
      letter-spacing: 0;
    }

    .section-meta {
      color: #98a2b3;
      font-size: 11px;
      white-space: nowrap;
    }

    .priority-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .priority-card {
      min-height: 159.5px;
      position: relative;
      display: block;
      padding: 18.7px;
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: transform .17s var(--ease), border-color .17s var(--ease), box-shadow .17s var(--ease);
    }

    .priority-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--accent);
      opacity: 0;
      transition: opacity .17s var(--ease);
    }

    .priority-card:hover {
      transform: translateY(-2px);
      border-color: var(--line-strong);
      box-shadow: 0 12px 30px rgba(16,24,40,.075);
    }

    .priority-card:hover::before { opacity: 1; }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .icon svg {
      width: 17px;
      height: 17px;
      stroke: #53657a;
    }

    .external-arrow {
      color: #98a2b3;
      font-size: 15px;
      transition: color .16s var(--ease), transform .16s var(--ease);
    }

    .priority-card:hover .external-arrow,
    .row:hover .external-arrow,
    .mini-link:hover .external-arrow {
      color: var(--accent);
      transform: translate(1px,-1px);
    }

    .card-copy {
      position: absolute;
      left: 17px;
      right: 17px;
      bottom: 16px;
    }

    .card-copy strong {
      display: block;
      font-size: 15.95px;
      font-weight: 720;
      letter-spacing: -.015em;
    }

    .card-copy span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12.65px;
      letter-spacing: 0;
    }

    .list-panel {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 7px 22px rgba(16,24,40,.04);
    }

    .row {
      min-height: 63.8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15.4px;
      padding: 12.1px 15.4px;
      color: inherit;
      text-decoration: none;
      border-top: 1px solid var(--line);
      transition: background .15s var(--ease);
    }

    .row:first-child { border-top: 0; }
    .row:hover { background: #fafbfc; }

    .row-group {
      display: block;
      padding: 0;
    }

    .row-summary {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 11px 14px;
      cursor: pointer;
      list-style: none;
    }

    .row-summary::-webkit-details-marker {
      display: none;
    }

    .row-summary::marker {
      content: "";
    }

    .row-group .row-left {
      flex: 1 1 auto;
    }

    .row-chevron {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      color: #98a2b3;
      border: 1px solid var(--line);
      border-radius: 8px;
      transition: color .16s var(--ease), background .16s var(--ease), transform .18s var(--ease);
    }

    .row-chevron svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
    }

    .row-summary:hover .row-chevron {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .row-group[open] .row-chevron {
      transform: rotate(180deg);
    }

    .row-actions {
      width: auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 0 14px 13px 57px;
    }

    .row-group[open] .row-actions {
      animation: handoverReveal .18s var(--ease);
    }

    @keyframes handoverReveal {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: none; }
    }

    .row-action {
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      color: #344054;
      text-decoration: none;
      background: #f9fafb;
      border: 1px solid var(--line);
      border-radius: 9px;
      transition: background .15s var(--ease), border-color .15s var(--ease);
    }

    .row-action:hover {
      background: #f4f6f8;
      border-color: var(--line-strong);
    }

    .row-action-copy {
      min-width: 0;
    }

    .row-action-copy strong {
      display: block;
      font-size: 12.2px;
      font-weight: 700;
    }

    .row-action-copy span {
      display: block;
      margin-top: 2px;
      color: #8a94a6;
      font-size: 10.4px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .row-action:hover .external-arrow {
      color: var(--accent);
      transform: translate(1px,-1px);
    }

    .row-left {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .row-icon {
      width: 35.2px;
      height: 35.2px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 9px;
    }

    .row-icon svg {
      width: 16.5px;
      height: 16.5px;
      stroke: #738198;
    }

    .row-text {
      min-width: 0;
    }

    .row-text strong {
      display: block;
      font-size: 13.5px;
      font-weight: 660;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-text span {
      display: block;
      margin-top: 2px;
      color: #8a94a6;
      font-size: 10.8px;
      letter-spacing: 0;
    }

    .external-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .external-card {
      padding: 16.5px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .external-head {
      display: flex;
      align-items: center;
      gap: 12.1px;
      margin-bottom: 13px;
    }

    .external-head .icon {
      width: 38.5px;
      height: 38.5px;
    }

    .external-head strong {
      display: block;
      font-size: 15.18px;
      font-weight: 720;
      letter-spacing: -.01em;
    }

    .external-head span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11.88px;
      letter-spacing: 0;
    }

    .mini-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 7px;
      padding: 9px 10px;
      color: #344054;
      text-decoration: none;
      background: #f9fafb;
      border: 1px solid var(--line);
      border-radius: 9px;
      font-size: 12.2px;
      font-weight: 650;
      transition: background .15s var(--ease), border-color .15s var(--ease);
    }

    .mini-link:hover {
      background: #f4f6f8;
      border-color: var(--line-strong);
    }

    .footnote {
      margin-top: 28px;
      padding: 0 2px;
      color: #98a2b3;
      font-size: 10.5px;
      letter-spacing: 0;
    }

    .priority-card:focus-visible,
    .row:focus-visible,
    .row-summary:focus-visible,
    .row-action:focus-visible,
    .mini-link:focus-visible,
    .tab:focus-visible {
      outline: 3px solid rgba(35,75,120,.14);
      outline-offset: 2px;
    }

    @media (max-width: 900px) {
      .brand-logo {
        width: 175px;
        height: 50px;
      }

      .brand-divider,
      .brand-copy {
        display: none;
      }

      .priority-grid,
      .external-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 640px) {
      .shell {
        width: min(100% - 20px, 1120px);
        padding-top: 10px;
      }

      .appbar {
        top: 7px;
        min-height: 68px;
        padding: 8px 9px;
        gap: 10px;
      }

      .brand-logo {
        width: 135px;
        height: 42px;
      }

      .tab {
        padding: 7px 9px;
        font-size: 11.5px;
      }

      .view {
        padding-top: 20px;
      }

      .priority-grid,
      .external-grid {
        grid-template-columns: 1fr;
      }

      .priority-card {
        min-height: 145.2px;
      }

      .section-meta {
        display: none;
      }

      .row-group {
        padding: 0;
      }

      .row-summary {
        padding: 12px 14px;
      }

      .row-actions {
        width: auto;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin: 0 14px 13px;
      }

      .row-action {
        min-height: 52px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;
      }
    }

    .disabled-link{
      cursor:not-allowed;
      opacity:.64;
      background:#f7f8fa;
    }

    .company-label{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      min-width:0;
      line-height:1.15;
    }

    .company-label strong{
      display:block;
      color:#344054;
      font-size:12.5px;
      font-weight:750;
      letter-spacing:.01em;
    }

    .company-label small{
      display:block;
      margin-top:3px;
      color:#98a2b3;
      font-size:9.8px;
      font-weight:500;
      line-height:1.2;
      white-space:normal;
    }

    /* Visual refinement v14 */
    .priority-card,
    .external-card,
    .row{
      position:relative;
    }

    .icon-accent{
      border-color:transparent !important;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.45);
    }

    .tone-blue .icon-accent,
    .tone-blue .row-icon{ background:#eef5ff; border-color:#d8e8ff; }
    .tone-blue .icon-accent svg,
    .tone-blue .row-icon svg{ stroke:#2f6fca; }

    .tone-green .icon-accent,
    .tone-green .row-icon{ background:#eef9f2; border-color:#d8efe0; }
    .tone-green .icon-accent svg,
    .tone-green .row-icon svg{ stroke:#2f7d4d; }

    .tone-amber .icon-accent,
    .tone-amber .row-icon{ background:#fff7e8; border-color:#f3e3bd; }
    .tone-amber .icon-accent svg,
    .tone-amber .row-icon svg{ stroke:#a66a19; }

    .tone-indigo .icon-accent,
    .tone-indigo .row-icon{ background:#f1f2ff; border-color:#dfe1ff; }
    .tone-indigo .icon-accent svg,
    .tone-indigo .row-icon svg{ stroke:#5661c7; }

    .tone-violet .icon-accent,
    .tone-violet .row-icon{ background:#f6f0ff; border-color:#e8dcfb; }
    .tone-violet .icon-accent svg,
    .tone-violet .row-icon svg{ stroke:#7b56b3; }

    .tone-teal .icon-accent,
    .tone-teal .row-icon{ background:#edf9f8; border-color:#d5efec; }
    .tone-teal .icon-accent svg,
    .tone-teal .row-icon svg{ stroke:#267e79; }

    .tone-rose .row-icon{ background:#fff1f3; border-color:#f8dce1; }
    .tone-rose .row-icon svg{ stroke:#b24f62; }

    .tone-slate .row-icon{ background:#f3f5f8; border-color:#e1e5eb; }
    .tone-slate .row-icon svg{ stroke:#667085; }

    .priority-card::after,
    .external-card::after{
      content:"";
      position:absolute;
      left:0;
      top:0;
      width:100%;
      height:3px;
      opacity:0;
      transform:scaleX(.35);
      transform-origin:left;
      transition:opacity .18s var(--ease), transform .18s var(--ease);
      background:var(--accent);
    }

    .priority-card:hover::after,
    .external-card:hover::after{
      opacity:1;
      transform:scaleX(1);
    }

    .tone-blue::after{ background:#3b82f6; }
    .tone-green::after{ background:#3f9a61; }
    .tone-amber::after{ background:#d08a25; }
    .tone-indigo::after{ background:#6875d8; }
    .tone-violet::after{ background:#8b66c2; }
    .tone-teal::after{ background:#31928c; }

    .external-card{
      transition:transform .17s var(--ease), border-color .17s var(--ease), box-shadow .17s var(--ease);
    }

    .external-card:hover{
      transform:translateY(-2px);
      border-color:var(--line-strong);
      box-shadow:0 12px 30px rgba(16,24,40,.07);
    }

    .company-code{
      min-width:34px;
      display:inline-flex !important;
      align-items:center;
      justify-content:center;
      align-self:flex-start;
      padding:3px 7px;
      border-radius:6px;
      font-size:11px !important;
      line-height:1.2;
      letter-spacing:.04em !important;
      border:1px solid transparent;
    }

    .company-hjf{
      color:#b42318 !important;
      background:#fff1f0;
      border-color:#f3c7c3;
    }

    .company-kps{
      color:#175cd3 !important;
      background:#eff4ff;
      border-color:#c7d7fe;
    }

    .company-ost{
      color:#9a4a0b !important;
      background:#fff4e8;
      border-color:#f2cfaa;
    }

    .company-label small{
      margin-top:4px !important;
      color:#7d8899 !important;
    }

    .mini-link{
      min-height:49px;
    }

    .external-arrow{
      width:25px;
      height:25px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
      border-radius:7px;
      background:#fff;
      border:1px solid #e7ebf0;
      font-size:13px;
    }

    .priority-card:hover .external-arrow,
    .row:hover .external-arrow,
    .mini-link:hover .external-arrow{
      background:var(--accent-soft);
      border-color:#d8e4f3;
    }

    /* Dark mode — restrained enterprise palette */
    .header-actions{
      display:flex;
      align-items:center;
      gap:8px;
      flex:0 0 auto;
    }

    .theme-toggle{
      width:38px;
      height:38px;
      flex:0 0 auto;
      display:grid;
      place-items:center;
      padding:0;
      cursor:pointer;
      color:#667085;
      background:#ffffff;
      border:1px solid var(--line);
      border-radius:10px;
      box-shadow:0 1px 3px rgba(16,24,40,.04);
      transition:background .16s var(--ease), border-color .16s var(--ease), color .16s var(--ease);
    }

    .theme-toggle:hover{
      color:#344054;
      background:#f8fafc;
      border-color:var(--line-strong);
    }

    .theme-toggle:focus-visible{
      outline:3px solid rgba(35,75,120,.14);
      outline-offset:2px;
    }

    .theme-icon{
      width:17px;
      height:17px;
      stroke:currentColor;
    }

    .theme-icon-sun{ display:none; }

    body.dark{
      --bg:#161a20;
      --surface:#20252c;
      --surface-2:#252b33;
      --text:#edf0f3;
      --muted:#9aa4b2;
      --line:#303740;
      --line-strong:#3c4652;
      --accent:#8fa9c4;
      --accent-soft:#283441;
      --shadow:0 8px 24px rgba(0,0,0,.16);
    }

    body.dark .appbar{
      background:rgba(31,36,43,.96);
      border-color:#303740;
      box-shadow:0 8px 24px rgba(0,0,0,.16);
    }

    body.dark .brand-logo{
      background:#ffffff;
      border-radius:9px;
      padding:2px 4px;
    }

    body.dark .brand-divider{
      background:#343b45;
    }

    body.dark .brand-copy strong,
    body.dark .section-title h2{
      color:#eef1f4;
    }

    body.dark .brand-copy span,
    body.dark .section-title p,
    body.dark .section-meta,
    body.dark .row-text span,
    body.dark .external-head span,
    body.dark .card-copy span,
    body.dark .footnote{
      color:#9aa4b2;
    }

    body.dark .tabs{
      background:#191e24;
      border-color:#303740;
    }

    body.dark .tab{
      color:#98a2b3;
    }

    body.dark .tab:hover{
      color:#eef1f4;
    }

    body.dark .tab.active{
      color:#f5f7f9;
      background:#2a3038;
      box-shadow:none;
    }

    body.dark .theme-toggle{
      color:#c0c7d0;
      background:#252b33;
      border-color:#343c46;
      box-shadow:none;
    }

    body.dark .theme-toggle:hover{
      color:#ffffff;
      background:#2b323b;
      border-color:#46515e;
    }

    body.dark .theme-icon-moon{ display:none; }
    body.dark .theme-icon-sun{ display:block; }

    body.dark .priority-card,
    body.dark .external-card,
    body.dark .list-panel{
      background:#20252c;
      border-color:#303740;
      box-shadow:0 8px 22px rgba(0,0,0,.12);
    }

<label class="wide">Keterangan singkat<input name="keterangan" maxlength="500"></label>
<label>Urutan tampil<input name="urutan" type="number" min="1" max="9999" required></label>
<label>Logo / ikon<select id="link-logo-mode"><option value="ikon">Ikon bawaan</option><option value="logo">Unggah logo</option></select></label>
<label id="link-icon-field">Pilihan ikon<select name="ikon" id="link-icon"></select></label><div class="link-logo-preview" id="link-logo-preview" aria-hidden="true"></div>
<label id="link-logo-field" class="wide" hidden>Gambar logo<input type="file" id="link-logo-file" accept="image/png,image/jpeg,image/webp"><small>PNG, JPG, atau WebP. Ukuran logo disesuaikan otomatis.</small><small id="link-logo-status" role="status"></small></label>
<label class="link-check" id="link-primary-field"><input type="checkbox" name="utama"> Jadikan link utama (maksimal 3)</label>
<label class="link-check"><input type="checkbox" name="aktif" checked> Aktif</label>
</div><div class="link-buttons-heading"><h3>Tombol link</h3><button type="button" class="link-button" id="link-add-button">Tambah tombol</button></div><div id="link-buttons"></div><p class="link-error" id="link-form-error" role="alert" hidden></p></div>
<footer><button type="button" class="link-button" id="link-cancel">Batal</button><button type="submit" class="link-button primary" id="link-save">Simpan link</button></footer></form></dialog>
</body></html>
